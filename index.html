        if (typeof window !== 'undefined') {
          if (!window.global) window.global = window;
          if (!window.process) window.process = { env: { NODE_ENV: 'production' } };
          if (typeof buffer !== 'undefined' && buffer.Buffer) {
            window.Buffer = buffer.Buffer;
          }
          if (typeof globalThis !== 'undefined') {
            if (!globalThis.global) globalThis.global = globalThis;
            if (!globalThis.process) globalThis.process = { env: { NODE_ENV: 'production' } };
            if (typeof buffer !== 'undefined' && buffer.Buffer) {

            }
          }

    <script>
      (function() {
        // Safe WebSocket guard for sandbox environment where HMR websocket is not open
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            const protoStr = String(protocols || '');
            if (urlStr.includes('vite-hmr') || protoStr.includes('vite-hmr')) {
              const dummy = new EventTarget();
              dummy.readyState = 3; // CLOSED
              dummy.send = function() {};
              dummy.close = function() {};
              dummy.addEventListener = EventTarget.prototype.addEventListener;
              dummy.removeEventListener = EventTarget.prototype.removeEventListener;
              dummy.dispatchEvent = EventTarget.prototype.dispatchEvent;
              return dummy;
            }
            try {
              return new OrigWebSocket(url, protocols);
            } catch (e) {
              const dummy = new EventTarget();
              dummy.readyState = 3;
              dummy.send = function() {};
              dummy.close = function() {};
              return dummy;
            }
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Intercept and clean console for TonConnect SDK noise, ad networks, iframe origin mismatch warnings, and telemetry noise
        const origWarn = console.warn;
        const origError = console.error;
        const origInfo = console.info;
        const origLog = console.log;

        function safeExtractText(a) {
          if (a === null || a === undefined) return '';
          if (typeof a === 'string') return a;
          if (a instanceof Error) return (a.message || '') + ' ' + (a.stack || '');
          if (typeof a === 'object') {
            try {
              return JSON.stringify(a);
            } catch (_) {
              try {
                return (a.name || '') + ' ' + (a.message || '') + ' ' + Object.prototype.toString.call(a);
              } catch (__) {
                return '';
              }
            }
          }
          return String(a);
        }

        function shouldSilence(msg) {
          if (!msg) return false;
          const s = String(msg).toLowerCase();
          return (
            s.includes('ton_connect_sdk') ||
            s.includes('ton_connect') ||
            s.includes('tonconnect') ||
            s.includes('manifest') ||
            s.includes('postmessage') ||
            s.includes('cdn.tailwindcss.com') ||
            s.includes('telegram') ||
            s.includes('richpartners') ||
            s.includes('richinfo') ||
            s.includes('tg-ob') ||
            s.includes('webgl') ||
            s.includes('three') ||
            s.includes('context lost') ||
            s.includes('websocket') ||
            s.includes('vite') ||
            s.includes('blocked a frame') ||
            s.includes('cross-origin') ||
            s.includes('failed to load resource') ||
            s.includes('defaultprops') ||
            s.includes('deprecat') ||
            s.includes('adsgram') ||
            s.includes('monetag') ||
            s.includes('alwingulla') ||
            s.includes('activity logged') ||
            s.includes('heartbeat') ||
            s.includes('telemetry') ||
            s.includes('iframe') ||
            s.includes('permission') ||
            s.includes('app manifest')
          );
        }

        console.log = function(...args) {
          const combined = args.map(safeExtractText).join(' ');
          if (shouldSilence(combined)) return;
          origLog.apply(console, args);
        };

        console.info = function(...args) {
          const combined = args.map(safeExtractText).join(' ');
          if (shouldSilence(combined)) return;
          origInfo.apply(console, args);
        };

        console.warn = function(...args) {
          const combined = args.map(safeExtractText).join(' ');
          if (shouldSilence(combined)) return;
          origWarn.apply(console, args);
        };

        console.error = function(...args) {
          const combined = args.map(safeExtractText).join(' ');
          if (shouldSilence(combined)) return;
          origError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (event && event.message && shouldSilence(event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
          if (event && event.filename && shouldSilence(event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            const reasonStr = safeExtractText(event.reason);
            if (shouldSilence(reasonStr)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
