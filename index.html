    <script>
      (function() {
        // Safe WebSocket guard for sandbox environment where HMR websocket is not open
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            const protoStr = String(protocols || '');
            if (urlStr.includes('vite-hmr') || protoStr.includes('vite-hmr')) {
              const dummy = new EventTarget();
              dummy.readyState = 3; // CLOSED
              dummy.send = function() {};
              dummy.close = function() {};
              dummy.addEventListener = EventTarget.prototype.addEventListener;
              dummy.removeEventListener = EventTarget.prototype.removeEventListener;
              dummy.dispatchEvent = EventTarget.prototype.dispatchEvent;
              return dummy;
            }
            try {
              return new OrigWebSocket(url, protocols);
            } catch (e) {
              const dummy = new EventTarget();
              dummy.readyState = 3;
              dummy.send = function() {};
              dummy.close = function() {};
              return dummy;
            }
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Intercept and clean console for sandbox iframe noise, ad networks, WebGL duplicate contexts, and Tailwind CDN
        const origWarn = console.warn;
        const origError = console.error;
        const origInfo = console.info;
        const origLog = console.log;

        function shouldSilence(msg) {
          if (!msg) return false;
          const s = String(msg).toLowerCase();
          return (
            s.includes('cdn.tailwindcss.com') ||
            s.includes('telegram') ||
            s.includes('richpartners') ||
            s.includes('richinfo') ||
            s.includes('tg-ob') ||
            s.includes('webgl') ||
            s.includes('three') ||
            s.includes('context lost') ||
            s.includes('websocket') ||
            s.includes('vite') ||
            s.includes('blocked a frame') ||
            s.includes('cross-origin') ||
            s.includes('failed to load resource') ||
            s.includes('defaultprops') ||
            s.includes('deprecat') ||
            s.includes('ton_connect') ||
            s.includes('tonconnect') ||
            s.includes('adsgram') ||
            s.includes('monetag') ||
            s.includes('alwingulla') ||
            s.includes('activity logged') ||
            s.includes('heartbeat') ||
            s.includes('telemetry')
          );
        }

        console.log = function(...args) {
          const combined = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
          if (shouldSilence(combined)) return;
          origLog.apply(console, args);
        };

        console.info = function(...args) {
          const combined = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
          if (shouldSilence(combined)) return;
          origInfo.apply(console, args);
        };

        console.warn = function(...args) {
          const combined = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
          if (shouldSilence(combined)) return;
          origWarn.apply(console, args);
        };

        console.error = function(...args) {
          const combined = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
          if (shouldSilence(combined)) return;
          origError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (event && event.message && shouldSilence(event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
          if (event && event.filename && shouldSilence(event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            const reasonStr = String(event.reason?.message || event.reason);
            if (shouldSilence(reasonStr)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
